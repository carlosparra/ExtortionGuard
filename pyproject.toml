[tool.poetry]
name = "extortionguard"
version = "0.1.0"
description = "ExtortionGuard Backend "
authors = ["ExtortionGuard Team <team@example.com>"]
package-mode = false
packages = [{ include = "app" }]


[tool.poetry.dependencies]
python = ">=3.11,<3.13"
fastapi = "^0.115.0"
uvicorn = {extras=["standard"], version="^0.30.0"}
SQLAlchemy = "^2.0.36"
psycopg = {version = "^3.2.1", extras=["binary"]}
pydantic = "^2.8.2"
pydantic-settings = "^2.4.0"
phonenumbers = "^8.13.47"
requests = "^2.32.3"
python-multipart = "^0.0.9"
redis = "^5.0.8"


[tool.poetry.group.dev.dependencies]
pytest = "^8.3.2"
httpx = "^0.27.2"
pytest-cov = "^5.0.0"
ruff = "^0.6.9"
alembic = "^1.16.4"


[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"