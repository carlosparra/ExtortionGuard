version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: eg-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: extortion
      POSTGRES_USER: extuser
      POSTGRES_PASSWORD: extpass
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: eg-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  api:
    build: .
    container_name: eg-api
    depends_on:
      - postgres
      - redis
    env_file:
      - .env
    ports:
      - "8000:8000"
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]

volumes:
  pgdata: {}
